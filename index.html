<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Plano de Estudos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#e3e1d8;--ac:#2f6f5e;--ac2:#e7f1ee;--ok:#2f8f5b;--wr:#c8742b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171816;--card:#222420;--tx:#eceae2;--mut:#9a988e;--bd:#33362f;--ac:#5fb59d;--ac2:#243630;--ok:#5fc68b;--wr:#e0975a}}
:root[data-theme="dark"]{--bg:#171816;--card:#222420;--tx:#eceae2;--mut:#9a988e;--bd:#33362f;--ac:#5fb59d;--ac2:#243630;--ok:#5fc68b;--wr:#e0975a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
input,select,button,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>input{flex:1}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--mut)}
.day{aspect-ratio:1;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.day.out{visibility:hidden}.day.today{border-color:var(--ac);font-weight:700}.day.sel{background:var(--ac2);border-color:var(--ac)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.dots .p{background:var(--wr)}.dots .d{background:var(--ok)}
.course{margin-bottom:14px}
.course-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.course-h b{flex:1}.small{font-size:12px;color:var(--mut)}
.les{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.les input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.les span.t{flex:1}.les.done span.t{text-decoration:line-through;color:var(--mut)}
.x{background:transparent;color:var(--mut);padding:2px 8px}
.badge{font-size:12px;background:var(--ac2);color:var(--ac);border-radius:10px;padding:1px 8px}
.empty{color:var(--mut);padding:8px 0}
#log{height:380px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);margin-bottom:8px}
.m{max-width:92%;padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--ac);color:#fff;margin-left:auto}.m.a{background:var(--card);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{font-size:13px;padding:5px 10px}
#chatf{display:flex;gap:8px}#chatf textarea{flex:1;resize:none;height:44px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Meu Plano de Estudos</h1>
  <p class="sub">Organize cursos e aulas, marque o que já concluiu e tire dúvidas ou faça exercícios com a IA.</p>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin:0 0 8px"><b id="pt">Progresso geral</b><span class="small" id="ps"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="row" style="margin:10px 0 0"><button class="ghost" id="ex">⬇ Exportar backup</button><button class="ghost" onclick="document.getElementById('im').click()">⬆ Importar backup</button><input type="file" id="im" accept=".json,application/json" style="display:none"></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="cal-h"><button class="ghost" id="prev">‹</button><b id="mt"></b><button class="ghost" id="next">›</button></div>
        <div class="cal" id="cal"></div>
        <p class="small" style="margin:10px 0 0"><span style="color:var(--wr)">●</span> planejada &nbsp; <span style="color:var(--ok)">●</span> concluída</p>
      </div>
      <div class="card">
        <h2 id="dt">Aulas do dia</h2>
        <div id="dl"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Cursos e aulas</h2>
        <div class="row"><input id="cn" placeholder="Novo curso (ex.: Python, Power BI…)"><button id="ca">Adicionar curso</button></div>
        <div class="row">
          <select id="ls"></select>
          <input id="lt" placeholder="Título da aula">
          <input id="ld" type="date">
          <button id="la">Adicionar aula</button>
        </div>
        <div id="cs"></div>
      </div>
    </div>
  </div>

  <div class="card" id="chatcard">
    <h2>💬 Chat de estudos</h2>
    <div class="row"><input id="wh" placeholder="URL do webhook do n8n (https://…/webhook/…)"></div>
    <div class="chips" id="chips"></div>
    <div id="log"></div>
    <form id="chatf" onsubmit="return false"><textarea id="ci" placeholder="Pergunte algo ou peça um exercício…"></textarea><button id="cb">Enviar</button></form>
  </div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function br(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
var S={courses:[],lessons:[]},today=iso(new Date()),sel=today,view=new Date();view.setDate(1);
var KEY="plano-estudos",WH="plano-estudos-webhook",SID=localStorage.getItem("plano-estudos-sid")||("e"+uid()+uid());
try{localStorage.setItem("plano-estudos-sid",SID)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function load(){try{var l=localStorage.getItem(KEY);if(l)S=JSON.parse(l)}catch(e){}}

function cname(id){var c=S.courses.find(function(c){return c.id===id});return c?c.name:""}
function render(){
  var tot=S.lessons.length,dn=S.lessons.filter(function(l){return l.done}).length;
  $("pb").style.width=(tot?dn/tot*100:0)+"%";
  $("ps").textContent=dn+" de "+tot+" aulas concluídas"+(tot?" ("+Math.round(dn/tot*100)+"%)":"");
  $("ls").innerHTML=S.courses.length?S.courses.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join(""):'<option value="">Crie um curso primeiro</option>';
  $("ld").value=$("ld").value||sel;
  renderCourses();renderCal();renderDay();
}
function lesRow(l,showCourse){
  return'<div class="les'+(l.done?" done":"")+'"><input type="checkbox" data-t="'+l.id+'"'+(l.done?" checked":"")+'><span class="t">'+esc(l.title)+(showCourse?' <span class="small">· '+esc(cname(l.cid))+'</span>':"")+'</span>'+(l.date?'<span class="badge">'+br(l.date)+'</span>':"")+'<button class="x" data-x="'+l.id+'" title="Remover">✕</button></div>';
}
function renderCourses(){
  if(!S.courses.length){$("cs").innerHTML='<div class="empty">Nenhum curso ainda. Comece adicionando o primeiro acima.</div>';return}
  $("cs").innerHTML=S.courses.map(function(c){
    var ls=S.lessons.filter(function(l){return l.cid===c.id}),d=ls.filter(function(l){return l.done}).length;
    return'<div class="course"><div class="course-h"><b>'+esc(c.name)+'</b><span class="small">'+d+'/'+ls.length+'</span><button class="x" data-xc="'+c.id+'" title="Remover curso">✕</button></div><div class="bar"><i style="width:'+(ls.length?d/ls.length*100:0)+'%"></i></div>'+(ls.map(function(l){return lesRow(l,false)}).join("")||'<div class="empty">Sem aulas.</div>')+'</div>';
  }).join("");
}
function renderCal(){
  var y=view.getFullYear(),m=view.getMonth();
  $("mt").textContent=view.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  var h=["D","S","T","Q","Q","S","S"].map(function(d){return'<div class="dow">'+d+'</div>'}).join("");
  var first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=n;d++){
    var k=iso(new Date(y,m,d)),ls=S.lessons.filter(function(l){return l.date===k}),p=ls.filter(function(l){return!l.done}).length,dn=ls.length-p;
    h+='<div class="day'+(k===today?" today":"")+(k===sel?" sel":"")+'" data-d="'+k+'">'+d+'<div class="dots">'+(p?'<i class="p"></i>':"")+(dn?'<i class="d"></i>':"")+'</div></div>';
  }
  $("cal").innerHTML=h;
}
function renderDay(){
  $("dt").textContent="Aulas de "+br(sel);
  var ls=S.lessons.filter(function(l){return l.date===sel});
  $("dl").innerHTML=ls.map(function(l){return lesRow(l,true)}).join("")||'<div class="empty">Nada planejado para este dia. Use o formulário ao lado para agendar uma aula.</div>';
}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.d){sel=t.dataset.d;$("ld").value=sel;renderCal();renderDay()}
  else if(t.closest&&t.closest(".day")&&t.closest(".day").dataset.d){sel=t.closest(".day").dataset.d;$("ld").value=sel;renderCal();renderDay()}
  else if(t.dataset.x){S.lessons=S.lessons.filter(function(l){return l.id!==t.dataset.x});save();render()}
  else if(t.dataset.xc){if(confirm("Remover o curso e todas as suas aulas?")){S.courses=S.courses.filter(function(c){return c.id!==t.dataset.xc});S.lessons=S.lessons.filter(function(l){return l.cid!==t.dataset.xc});save();render()}}
});
document.addEventListener("change",function(e){
  var id=e.target.dataset.t;if(!id)return;
  var l=S.lessons.find(function(l){return l.id===id});l.done=e.target.checked;l.doneAt=l.done?today:null;save();render();
});
$("prev").onclick=function(){view.setMonth(view.getMonth()-1);renderCal()};
$("next").onclick=function(){view.setMonth(view.getMonth()+1);renderCal()};
$("ca").onclick=function(){var n=$("cn").value.trim();if(!n)return;S.courses.push({id:uid(),name:n});$("cn").value="";save();render()};
$("la").onclick=function(){
  var t=$("lt").value.trim(),c=$("ls").value;if(!t||!c)return;
  S.lessons.push({id:uid(),cid:c,title:t,date:$("ld").value||"",done:false});$("lt").value="";save();render();
};

/* ---- Chat ---- */
var busy=false;
function ctx(){
  var d=S.lessons.filter(function(l){return l.done}),p=S.lessons.filter(function(l){return!l.done});
  var f=function(l){return"- "+cname(l.cid)+": "+l.title+(l.date?" ("+br(l.date)+")":"")};
  return"Você é um tutor paciente em português do Brasil. Ajude o aluno a estudar: explique com clareza e exemplos curtos, e quando pedir exercícios, proponha um de cada vez, espere a resposta e corrija com explicação. Seja objetivo.\n\nAulas concluídas:\n"+(d.map(f).join("\n")||"(nenhuma)")+"\n\nAulas pendentes:\n"+(p.map(f).join("\n")||"(nenhuma)");
}
function add(role,text){
  var m=document.createElement("div");m.className="m "+(role==="user"?"u":"a");m.textContent=text;$("log").appendChild(m);$("log").scrollTop=1e9;return m;
}
async function send(text){
  if(busy||!text.trim())return;
  var url=($("wh").value||"").trim();
  if(!url){add("assistant","Cole primeiro a URL do webhook do n8n no campo acima do chat.");return}
  busy=true;$("cb").disabled=true;add("user",text);var bub=add("assistant","…");
  try{
    var r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:SID,message:text,context:ctx()})});
    var raw=await r.text(),out=raw;
    if(!r.ok)throw new Error(r.status);
    try{var j=JSON.parse(raw);if(Array.isArray(j))j=j[0];out=j.output||j.reply||j.text||j.message||raw}catch(e){}
    bub.textContent=out;
  }catch(e){bub.textContent="Não consegui falar com a IA. Verifique a URL do webhook, se o workflow está ativo e o CORS (Allowed Origins) no nó Webhook."}
  busy=false;$("cb").disabled=false;
}
function chips(){
  var items=[["📝 Exercício da última aula",function(){
    var d=S.lessons.filter(function(l){return l.done}).sort(function(a,b){return(b.doneAt||"")<(a.doneAt||"")?-1:1})[0];
    return d?"Crie um exercício sobre a aula \""+d.title+"\" ("+cname(d.cid)+"). Um por vez.":"Crie um exercício simples para eu começar a praticar."}],
    ["🔁 Revisar o que concluí",function(){return"Faça um resumo rápido e 3 perguntas de revisão sobre as aulas que já concluí."}],
    ["📅 Sugerir ordem de estudo",function(){return"Com base nas aulas pendentes, sugira uma ordem de estudo e um ritmo semanal."}]];
  $("chips").innerHTML="";
  items.forEach(function(it){var b=document.createElement("button");b.className="ghost";b.textContent=it[0];b.onclick=function(){send(it[1]())};$("chips").appendChild(b)});
}
$("chatf").addEventListener("submit",function(){var v=$("ci").value;$("ci").value="";send(v)});
$("cb").onclick=function(){var v=$("ci").value;$("ci").value="";send(v)};
$("ci").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();var v=$("ci").value;$("ci").value="";send(v)}});
chips();
add("assistant","Olá! Sou seu tutor. Posso tirar dúvidas, revisar o que você concluiu ou criar exercícios. Por onde começamos?");

load().then(render);render();
$("wh").value=localStorage.getItem(WH)||"https://rmfidelis-n8n.ddns.net/webhook/plano-estudos";
$("wh").addEventListener("change",function(){try{localStorage.setItem(WH,$("wh").value.trim())}catch(e){}});
$("ex").onclick=function(){
  var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"})),a=document.createElement("a");
  a.href=u;a.download="plano-de-estudos-"+today+".json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);
};
$("im").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.courses)||!Array.isArray(d.lessons))throw 0;S=d;save();render()}catch(x){alert("Arquivo de backup inválido.")}};
  r.readAsText(f);e.target.value="";
};
})();
</script>
</body>
</html>
